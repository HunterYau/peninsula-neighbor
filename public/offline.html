<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline · Peninsula Neighbor</title><style>body{font:16px/1.6 system-ui;color:#183b3e;background:#f5f7f8;max-width:640px;margin:10vh auto;padding:24px}h1{font-size:32px}article{background:white;padding:20px;border:1px solid #dce3e5;border-radius:12px;margin:14px 0}a{color:#12665f}small{color:#65777b}</style><img src="/favicon.svg" width="44" alt="Peninsula Neighbor"><h1>You’re offline.</h1><p>Your local reminders are available below. Community conversations, live conditions, and synced data will return when you reconnect.</p><div id="items"></div><a href="/">Try connecting again →</a><p><small>This offline page does not provide live emergency information. For an emergency, call 911.</small></p><script>try{const p=JSON.parse(localStorage.getItem('pn-v2-preferences')||'{}');for(const r of (p.reminders||[]).filter(r=>!r.done)){const card=document.createElement('article');const title=document.createElement('strong');title.textContent=r.title;const date=document.createElement('div');date.textContent=r.date;card.append(title,date);document.getElementById('items').append(card)}}catch{}</script></html>
