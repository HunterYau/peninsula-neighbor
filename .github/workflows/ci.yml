name: Verify Peninsula Neighbor
on:
  push:
    branches: [main, codex/peninsula-redesign, codex/pv-chatbot, codex/pv-civic-design]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm run install:ci
      - run: npm run check
      - run: npm test
      - run: npm run build
